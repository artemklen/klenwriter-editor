[package]
name = "editor-reliability-native"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false
description = "Standalone native public API reliability and measurement consumer"

# Test/measurement dependencies never enter the production/browser workspace.
[workspace]
resolver = "3"

[features]
default = []
allocator-profile = ["dep:dhat"]

[dependencies]
editor_core = { package = "klenwriter-editor-core", path = "../../../crates/core", version = "=0.0.0" }
editor_engine = { package = "klenwriter-editor-engine", path = "../../../crates/engine", version = "=0.0.0" }
editor_kwdj = { package = "klenwriter-editor-kwdj", path = "../../../crates/kwdj", version = "=0.0.0" }
editor_notes = { package = "klenwriter-editor-notes", path = "../../../crates/notes", version = "=0.0.0" }
editor_registry = { package = "klenwriter-editor-registry", path = "../../../crates/registry", version = "=0.0.0" }
editor_extensions = { package = "klenwriter-editor-extensions", path = "../../../crates/extensions", version = "=0.0.0" }
editor_bridge = { package = "klenwriter-editor-bridge", path = "../../../crates/bridge", version = "=0.0.0" }
editor_protocol = { package = "klenwriter-editor-protocol", path = "../../../crates/protocol", version = "=0.0.0" }
editor_kwdj_sdk = { package = "klenwriter-editor-kwdj-sdk", path = "../../../crates/kwdj-sdk", version = "=0.0.0" }
editor_notes_sdk = { package = "klenwriter-editor-notes-sdk", path = "../../../crates/notes-sdk", version = "=0.0.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
uuid = "=1.23.3"
dhat = { version = "=0.3.3", optional = true }

[dev-dependencies]
proptest = "=1.12.0"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
