[package]
name = "editor-extension-external-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false
description = "External public-API composition fixture for optional compiled profile modules"

# Deliberately outside the production workspace, with its own committed lockfile.
[workspace]
resolver = "3"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "extensions-consumer"
path = "src/main.rs"

[features]
default = []
notes = ["dep:editor_notes_sdk"]
kwdj = ["dep:editor_kwdj_sdk"]

[dependencies]
editor_bridge = { package = "klenwriter-editor-bridge", path = "../../../crates/bridge", version = "=0.0.0" }
editor_protocol = { package = "klenwriter-editor-protocol", path = "../../../crates/protocol", version = "=0.0.0" }
editor_notes_sdk = { package = "klenwriter-editor-notes-sdk", path = "../../../crates/notes-sdk", version = "=0.0.0", optional = true }
editor_kwdj_sdk = { package = "klenwriter-editor-kwdj-sdk", path = "../../../crates/kwdj-sdk", version = "=0.0.0", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
