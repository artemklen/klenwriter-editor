[package]
name = "klenwriter-editor-kwdj-sdk"
version.workspace = true
edition.workspace = true
rust-version = "1.97.1"
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
editor_core.workspace = true
editor_engine.workspace = true
editor_kwdj.workspace = true
editor_registry.workspace = true
editor_extensions.workspace = true
editor_protocol = { package = "klenwriter-editor-protocol", path = "../protocol", version = "=0.0.0" }
editor_bridge = { package = "klenwriter-editor-bridge", path = "../bridge", version = "=0.0.0" }
serde.workspace = true
serde_json.workspace = true

[features]
default = []
sdk-types = ["dep:ts-rs", "editor_protocol/sdk-types"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ts-rs = { version = "=12.0.1", optional = true, default-features = false, features = ["serde-compat"] }

[dependencies.uuid]
version = "=1.23.3"
default-features = false

[package.metadata.klenwriter-editor]
role = "kwdj-sdk"
source-provenance = "SOURCE-PROVENANCE.json"
public-api-stability = "bootstrap"
