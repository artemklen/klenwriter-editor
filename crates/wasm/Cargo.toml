[package]
name = "klenwriter-editor-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "KlenWriter Editor WASM composition root; pre-alpha bootstrap"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.klenwriter-editor]
role = "wasm"
source-provenance = "SOURCE-PROVENANCE.json"
public-api-stability = "bootstrap"

[lints]
workspace = true

[dependencies]
editor_core.workspace = true
editor_engine.workspace = true
editor_kwdj.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "=1.23.3", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true

