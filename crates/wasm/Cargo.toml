[package]
name = "klenwriter-editor-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "KlenWriter Editor WASM composition root; pre-alpha bootstrap"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.klenwriter-editor]
role = "wasm"
source-provenance = "SOURCE-PROVENANCE.json"
public-api-stability = "bootstrap"

[package.metadata.klenwriter-editor.sdk-type-generation]
generator = "ts-rs"
version = "12.0.1"
license = "MIT"
feature = "sdk-types"
scope = "optional native-only development tool; excluded from default runtime and wasm32 dependencies"

[lints]
workspace = true

[dependencies]
editor_core.workspace = true
editor_engine.workspace = true
editor_kwdj.workspace = true
editor_protocol = { package = "klenwriter-editor-protocol", path = "../protocol", version = "=0.0.0" }
editor_bridge = { package = "klenwriter-editor-bridge", path = "../bridge", version = "=0.0.0" }
editor_notes_sdk = { package = "klenwriter-editor-notes-sdk", path = "../notes-sdk", version = "=0.0.0", optional = true }
editor_kwdj_sdk = { package = "klenwriter-editor-kwdj-sdk", path = "../kwdj-sdk", version = "=0.0.0" }
serde.workspace = true
serde_json.workspace = true
uuid = { version = "=1.23.3", default-features = false }

[features]
default = ["notes"]
notes = ["dep:editor_notes_sdk"]
# Native declaration generation only; excluded from default and wasm dependencies.
sdk-types = ["dep:ts-rs", "editor_kwdj_sdk/sdk-types"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ts-rs = { version = "=12.0.1", optional = true, default-features = false, features = ["serde-compat"] }

# Build-time DOM coverage inventory only. These do not enter the WASM runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
editor_registry.workspace = true
editor_notes.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true

[[example]]
name = "projection_budget_probe"
crate-type = ["cdylib"]

[[example]]
name = "admission_budget_probe"
crate-type = ["cdylib"]

[[example]]
name = "corpus_probe"
crate-type = ["cdylib"]

[[example]]
name = "session_probe"
crate-type = ["cdylib"]

[[example]]
name = "transaction_probe"
crate-type = ["cdylib"]

[[example]]
name = "command_probe"
crate-type = ["cdylib"]

[[example]]
name = "history_probe"
crate-type = ["cdylib"]

[[example]]
name = "delta_probe"
crate-type = ["cdylib"]

[[example]]
name = "sdk_types"
required-features = ["sdk-types"]

[[example]]
name = "sdk_probe"
crate-type = ["cdylib"]

[[example]]
name = "typography_probe"
crate-type = ["cdylib"]

[[example]]
name = "drag_native"
path = "../../tests/fixtures/drag-native/main.rs"
