name: Editor CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: editing-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  workspace-and-browser:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm install --global npm@11.14.0 --ignore-scripts
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked --root .tools
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium firefox webkit
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 test --locked -p editor-internal-core -p editor-internal-kwdj
      - run: npm run check
      - run: npm test
      - run: node scripts/summarize-evidence.mjs
        if: always() && hashFiles('test-results/results.json') != ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-observations
          path: |
            artifacts/
            test-results/
            playwright-report/
            evidence/osr-58/automated/
          retention-days: 14
