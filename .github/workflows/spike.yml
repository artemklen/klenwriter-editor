name: Editor build
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: editing-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm install --global npm@11.14.0 --ignore-scripts
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked --root .tools
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: editor-build
          path: |
            packages/*/dist/
            artifacts/
          retention-days: 14
